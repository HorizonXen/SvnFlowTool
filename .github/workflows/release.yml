name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches release.json
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"

  macos:
    needs: release-metadata
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/engine-requirements.txt
      - run: python -m pip install --requirement packaging/engine-requirements.txt
      - run: python packaging/build_engine.py
      - run: packaging/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: svnflow-macos
          path: |
            dist/SvnFlow-macOS-*.zip
            dist/SvnFlow-macOS-*.zip.sha256
          if-no-files-found: error

  windows:
    needs: release-metadata
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/engine-requirements.txt
      - run: python -m unittest discover -s Tests/CrossPlatform -v
      - run: python -m pip install --requirement packaging/engine-requirements.txt
      - shell: pwsh
        run: ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: svnflow-windows
          path: |
            dist/SvnFlow-Windows-*.zip
            dist/SvnFlow-Windows-*.zip.sha256
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/* release.json packaging/install-windows.ps1 packaging/install-macos.sh --clobber
