name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches release.json
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"

  macos:
    needs: release-metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/engine-requirements.txt
      - run: python -m pip install --requirement packaging/engine-requirements.txt
      - run: python packaging/build_engine.py
      - run: packaging/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: svnflow-macos
          path: |
            dist/SvnFlow-macOS-*.zip
            dist/SvnFlow-macOS-*.zip.sha256
          if-no-files-found: error

  windows:
    needs: release-metadata
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/engine-requirements.txt
      - run: python Tests/CrossPlatform/test_platform.py -v
      - run: python Tests/CrossPlatform/test_trial_release.py -v
      - run: python Tests/CrossPlatform/test_windows_entry.py -v
      - run: python -m pip install --requirement packaging/engine-requirements.txt
      - shell: pwsh
        run: ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: svnflow-windows
          path: |
            dist/SvnFlow-Windows-*.zip
            dist/SvnFlow-Windows-*.zip.sha256
          if-no-files-found: error

  delivery-assets:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Commit verified packages to the delivery branch
        run: |
          mkdir -p packages
          cp release-assets/SvnFlow-macOS-*.zip release-assets/SvnFlow-macOS-*.zip.sha256 packages/
          cp release-assets/SvnFlow-Windows-*.zip release-assets/SvnFlow-Windows-*.zip.sha256 packages/
          git config user.name github-actions[bot]
          git config user.email github-actions
          git add packages
          git diff --cached --quiet && exit 0
          git commit -m "Add $GITHUB_REF_NAME release packages"
          git push origin HEAD:main
