name: Cross-platform core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/engine-requirements.txt
      - name: Test portable settings and locks
        run: python Tests/CrossPlatform/test_platform.py -v
      - name: Test exact archive approval guard
        run: python Tests/CrossPlatform/test_trial_release.py TrialReleaseTests.test_publish_requires_approval_for_exact_archive -v
      - name: Test version approval guard
        run: python Tests/CrossPlatform/test_trial_release.py TrialReleaseTests.test_version_change_invalidates_approval -v
      - name: Test Windows command entry
        run: python Tests/CrossPlatform/test_windows_entry.py -v
      - name: Parse and guard Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "packaging/install-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          Copy-Item release.json packaging/release.json
          try {
            & ./packaging/install-windows.ps1 -NoShortcut
            throw "Installer unexpectedly accepted a missing Windows GUI package"
          } catch {
            if ($_.Exception.Message -notlike "Windows package is not present:*") { throw }
          } finally {
            Remove-Item packaging/release.json -ErrorAction SilentlyContinue
          }
      - name: Install engine build dependencies
        run: python -m pip install --requirement packaging/engine-requirements.txt
      - name: Build embedded engine
        run: python packaging/build_engine.py
      - name: Build installable Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Build installable macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          packaging/build-release.sh > macos-package.log 2>&1
          status=$?
          cat macos-package.log
          if [ "$status" -ne 0 ]; then
            tail -n 20 macos-package.log | while IFS= read -r line; do echo "::error title=macOS package::${line}"; done
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: svnflow-engine-${{ runner.os }}-${{ runner.arch }}
          path: |
            .build/engine-dist/*
            dist/SvnFlow-Windows-*.zip
            dist/SvnFlow-Windows-*.zip.sha256
            dist/SvnFlow-macOS-*.zip
            dist/SvnFlow-macOS-*.zip.sha256
          if-no-files-found: error
